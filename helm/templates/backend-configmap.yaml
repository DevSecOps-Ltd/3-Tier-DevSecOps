apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-configmap
  labels:
    app: backend
data:
  DATABASE_HOST: {{ .Values.database.host | quote }}
  DATABASE_USER: {{ .Values.database.user | quote }}
  DATABASE_NAME: {{ .Values.database.name | quote }}
  RESET_ADMIN_PASSWORD: {{ .Values.resetAdminPassword | quote }}
  